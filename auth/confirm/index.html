<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>FeltFolio — Confirm</title>
<style>
  :root { --felt:#1E4A3A; --ink:#1B221E; --faint:#6B6F69; --paper:#FAF7F0; --brass:#A88434; --rule:#E4DFD3; }
  @media (prefers-color-scheme: dark) { :root { --felt:#143128; --ink:#F2EFE6; --faint:#8FA098; --paper:#0E1B16; --brass:#C9A24B; --rule:#24382F; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font:17px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  main { max-width:560px; margin:0 auto; padding:96px 24px 80px; text-align:center; }
  h1 { font-family:"New York","Iowan Old Style",Georgia,serif; font-size:32px; margin:0 0 6px; }
  .mark { display:inline-block; width:22px; height:22px; border:2px dashed var(--brass); border-radius:50%; vertical-align:-3px; margin-right:10px; background:radial-gradient(circle, var(--felt) 45%, transparent 46%); }
  p { color:var(--faint); }
  .status { font-size:19px; color:var(--ink); margin-top:28px; }
  a { color:var(--brass); }
</style>
</head>
<body>
<main>
  <h1><span class="mark"></span>FeltFolio</h1>
  <p id="status" class="status">Confirming…</p>
  <p id="detail"></p>
</main>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var tokenHash = q.get("token_hash");
  var type = q.get("type") || "email";
  var status = document.getElementById("status");
  var detail = document.getElementById("detail");
  function show(s, d) { status.textContent = s; detail.innerHTML = d || ""; }
  if (!tokenHash) {
    show("This link is incomplete.",
      "Open the link from your email again, or request a new one from the app.");
    return;
  }
  if (type === "recovery") {
    // Never verify a recovery token here: it is single-use, and only the
    // app can offer the set-new-password screen. Spending it on this page
    // would strand the user.
    show("Open this link on your iPhone.",
      "Password reset finishes in the FeltFolio app — open the email on the phone that has FeltFolio installed and tap the link there.");
    return;
  }
  fetch("https://bmtjvhpyanhxxrhvwwij.supabase.co/auth/v1/verify", {
    method: "POST",
    headers: { "Content-Type": "application/json", "apikey": "sb_publishable_b7cDRq0SAfv3t4al45FIcw_IsFpdOis" },
    body: JSON.stringify({ type: type, token_hash: tokenHash })
  }).then(function (r) {
    if (r.ok) {
      show(type === "recovery" ? "Link verified." : "Email confirmed.",
        "You're all set — open FeltFolio on your iPhone and sign in.");
    } else {
      return r.json().catch(function () { return {}; }).then(function (b) {
        var expired = (b.error_code || "").indexOf("expired") !== -1 ||
                      (b.msg || "").toLowerCase().indexOf("expired") !== -1;
        show(expired ? "This link has expired or was already used." : "This link didn't work.",
          "If your email is already confirmed, just sign in. Otherwise request a new link from the app, or contact <a href=\"mailto:support@feltfolio.app\">support@feltfolio.app</a>.");
      });
    }
  }).catch(function () {
    show("Couldn't reach the server.", "Check your connection and reload this page.");
  });
})();
</script>
</body>
</html>
