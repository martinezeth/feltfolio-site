<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<script>
// Remove credentials before any subresources load. Retain only in page memory.
const authLinkInput = { search: location.search, hash: location.hash };
history.replaceState(null, "", location.pathname);
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="robots" content="noindex">
<title>FeltFolio — Confirm</title>
<style>
  :root { --felt:#1E4A3A; --ink:#1B221E; --faint:#6B6F69; --paper:#FAF7F0; --brass:#8A6A22; --rule:#E4DFD3; }
  @media (prefers-color-scheme: dark) { :root { --felt:#143128; --ink:#F2EFE6; --faint:#8FA098; --paper:#0E1B16; --brass:#C9A24B; --rule:#24382F; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font:17px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  main { max-width:560px; margin:0 auto; padding:96px 24px 80px; text-align:center; }
  h1 { font-family:"New York","Iowan Old Style",Georgia,serif; font-size:32px; margin:0 0 6px; }
  .lockup { display:block; width:260px; max-width:100%; height:auto; margin:0 auto 4px; }
  p { color:var(--faint); }
  .status { font-size:19px; color:var(--ink); margin-top:28px; }
  a { color:var(--brass); }

  a { text-decoration:underline; text-underline-offset:0.2em; overflow-wrap:anywhere; }
  a:focus-visible, button:focus-visible { outline:3px solid var(--brass); outline-offset:4px; border-radius:3px; }
  nav { display:flex; flex-wrap:wrap; gap:4px 20px; }
  nav a { display:inline-flex; align-items:center; min-height:44px; margin:0; font-size:16px; }
  h2, h3 { scroll-margin-top:24px; }
  .legal-footer { margin-top:48px; padding-top:20px; border-top:1px solid var(--rule); }
  .legal-footer nav { justify-content:center; }
  @media (forced-colors: active) { a:focus-visible, button:focus-visible { outline-color:Highlight; } }
  #confirm { font:inherit; font-weight:600; min-height:48px; padding:10px 24px; border:2px solid var(--ink); border-radius:8px; color:var(--paper); background:var(--ink); cursor:pointer; }
  #confirm[hidden] { display:none; }
  #confirm:disabled { cursor:wait; }
</style>
</head>
<body>
<main>
  <h1><picture>
    <source srcset="/lockup-dark.png" media="(prefers-color-scheme: dark)">
    <img class="lockup" src="/lockup-light.png" alt="FeltFolio" width="600" height="192">
  </picture></h1>
  <p id="status" class="status" role="status" aria-live="polite" aria-atomic="true">Confirming…</p>
  <p id="detail" aria-live="polite"></p>
  <button id="confirm" type="button" hidden>Confirm email</button>
<footer class="legal-footer"><nav aria-label="Legal and support">
    <a href="/#privacy">Privacy Policy</a><a href="/#terms">Terms of Service</a>
    <a href="/#purchases">Purchases &amp; subscriptions</a><a href="mailto:support@feltfolio.app">Support</a>
  </nav></footer>
</main>
<script>
(function () {
  var q = new URLSearchParams(authLinkInput.search);
  var tokenHash = q.get("token_hash");
  var type = q.get("type");
  authLinkInput.search = "";
  var status = document.getElementById("status");
  var detail = document.getElementById("detail");
  function show(s, d) { status.textContent = s; detail.innerHTML = d || ""; }
  if (authLinkInput.hash || q.getAll("token_hash").length !== 1 || q.getAll("type").length !== 1 ||
      Array.from(q.keys()).some(function (key) { return key !== "type" && key !== "token_hash"; }) ||
      !/^[A-Za-z0-9_-]{16,1024}$/.test(tokenHash || "") ||
      ["signup", "email_change", "recovery"].indexOf(type) === -1) {
    show("This link is incomplete.",
      "Open the link from your email again, or request a new one from the app.");
    return;
  }
  if (type === "recovery") {
    // Never verify a recovery token here: it is single-use, and only the
    // app can offer the set-new-password screen. Spending it on this page
    // would strand the user.
    show("Open this link in FeltFolio.",
      "Password reset finishes in the FeltFolio app — open the email on the phone that has FeltFolio installed and tap the link there.");
    return;
  }
  show("Confirm your email.", "Continue only if you requested this confirmation.");
  var confirm = document.getElementById("confirm");
  confirm.hidden = false;
  confirm.addEventListener("click", function () {
  confirm.disabled = true;
  show("Confirming…", "");
  fetch("https://bmtjvhpyanhxxrhvwwij.supabase.co/auth/v1/verify", {
    method: "POST",
    headers: { "Content-Type": "application/json", "apikey": "sb_publishable_b7cDRq0SAfv3t4al45FIcw_IsFpdOis" },
    body: JSON.stringify({ type: type, token_hash: tokenHash })
  }).then(function (r) {
    if (r.ok) {
      show("Email confirmed.",
        "You're all set — open FeltFolio on your phone and sign in.");
    } else {
      return r.json().catch(function () { return {}; }).then(function (b) {
        var expired = (b.error_code || "").indexOf("expired") !== -1 ||
                      (b.msg || "").toLowerCase().indexOf("expired") !== -1;
        show(expired ? "This link has expired or was already used." : "This link didn't work.",
          "If your email is already confirmed, just sign in. Otherwise request a new link from the app, or contact <a href=\"mailto:support@feltfolio.app\">support@feltfolio.app</a>.");
      });
    }
  }).catch(function () {
    show("Couldn't reach the server.", "Check your connection, then open the original email link again.");
  });
  tokenHash = null;
  }, { once: true });
})();
</script>
</body>
</html>
